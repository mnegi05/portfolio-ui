<section class="learning-section" id="learning">
  <div class="container">
    <h2 class="section-title">Core Technologies</h2>
    
    <div class="tabs-container">
      <!-- Tabs Header -->
      <div class="tabs-header">
        @for (tech of technologies; track tech.id; let i = $index) {
          <button 
            class="tab-btn" 
            [class.active]="i === activeIndex"
            (click)="selectTab(i)"
            [attr.aria-selected]="i === activeIndex">
            <div class="icon-wrapper" [ngClass]="tech.iconClass" [innerHTML]="tech.svg"></div>
            <span class="tab-label">{{ tech.title }}</span>
            <div class="progress-bar" *ngIf="i === activeIndex">
              <div class="progress-fill" [class.paused]="isPaused"></div>
            </div>
          </button>
        }
      </div>

      <!-- Tab Content Area -->
      <div class="tab-content-area">
        @for (tech of technologies; track tech.id; let i = $index) {
          @if (i === activeIndex) {
            <div class="feature-list active-tab">
              @for (feature of tech.features; track feature.title) {
                <div class="glass-card feature-card">
                  <h4>{{ feature.title }}</h4>
                  <p>{{ feature.description }}</p>
                  <code class="syntax-block" *ngIf="feature.syntax">{{ feature.syntax }}</code>
                </div>
              }
            </div>
          }
        }
      </div>
    </div>
  </div>
</section>
